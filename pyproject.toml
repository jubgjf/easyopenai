[project]
name = "easyopenai"
dynamic = ["version"]
description = "Async OpenAI-compatible client with multi-provider scheduling, rate limiting, retries, and reasoning-model support."
readme = "README.md"
authors = [{ name = "jubgjf", email = "guanjiannan@outlook.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["openai", "llm", "async", "multi-provider", "reasoning"]
dependencies = [
    "aiolimiter>=1.2.1",
    "loguru>=0.7.3",
    "openai>=2.32.0",
    "pip>=16.1.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
]

[project.urls]
Homepage = "https://github.com/jubgjf/easyopenai"
Repository = "https://github.com/jubgjf/easyopenai.git"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/easyopenai"]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "respx>=0.23.1"]
